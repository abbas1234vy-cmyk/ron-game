<title>رون: حارس الطبيعة</title>
<style>
:root{color-scheme:dark;--bg:#020309;--fg:#e8ecff}
*{box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none}

#ov{background:rgba(2,3,9,.5)}

</style>

<body>
<canvas id="cv"></canvas>
<div id="hud"></div>
<div id="lft"><button data-k="l">◀</button><button data-k="r">▶</button></div>
<div id="rgt"><button data-k="j">▲</button><button id="fire" data-k="f">🌿</button></div>
<div id="ov">
<h1>🌍 رون: حارس الطبيعة</h1>
<p>الفضائيين هجموا على الأرض، ورون عنده طاقة وحدة بس: طاقة الطبيعة الخضراء. كل نوع فضائي يستخدم طاقة مختلفة: 🔥 نار برتقالية، ❄️ جليد أزرق، ⚡ كهرباء صفراء، ☠️ سم بنفسجي. اضغط الزر الأخضر للرمي، وإنط حتى تتفادى طلقاتهم.</p>
<input id="nm" maxlength="12" placeholder="اكتب اسمك"><button id="go">ابدأ المعركة</button>
</div>
<div id="msg"></div><button id="gear">⚙️</button><div id="set"></div><div id="pw"></div>
<div id="rot">📱 دوّر الجوال بالعرض حتى تلعب</div>
<script>
const H=180,GY=152;let W=320;
const cv=document.getElementById('cv'),x=cv.getContext('2d');
function fit(){W=Math.max(240,Math.round(H*innerWidth/innerHeight));cv.width=W;cv.height=H;x.imageSmoothingEnabled=false;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px'}
addEventListener('resize',fit);fit();
const EN=[{c:'#a32c18',l:'#e8742a',b:'#ff6a1a',sp:95,cd:1.6},{c:'#1d5f9e',l:'#5aa8e0',b:'#5ad8ff',sp:55,cd:2.2},{c:'#8a7410',l:'#e0c83a',b:'#ffe23a',sp:125,cd:1.2},{c:'#5a2478',l:'#a458c8',b:'#e07bff',sp:75,cd:2,spread:1},{c:'#1b6b5a',l:'#4fd1a8',b:'#5fffd0',sp:100,cd:1.5,vm:1.2,wv:40},{c:'#505868',l:'#9aa4b8',b:'#c8d0e0',sp:60,cd:2.2,hpm:2.5,vm:.6,tri:1},{c:'#a8286a',l:'#ff6aa8',b:'#ff5aa0',sp:110,cd:1.4,hpm:.7,vm:2.2}];
const PW=[{n:'نار',e:'🔥',c:'#d9561a',l:'#ffb070',cd:.26,dm:2},{n:'جليد',e:'❄️',c:'#3aa8d8',l:'#b8ecff',cd:.2,dm:1,slow:1},{n:'طبيعة',e:'🌿',c:'#2fa84a',l:'#caffd0',cd:.18,dm:1},{n:'هواء',e:'🌪️',c:'#7fb8c0',l:'#e0f4f6',cd:.1,dm:.6},{n:'صاعقة',e:'⚡',c:'#d8b820',l:'#fff6a0',cd:.22,dm:1,pierce:1}];let pw=2;
const NM=['نار','جليد','كهرباء','سم','شبح','عملاق','سريع'];
const RON=["....hhhh....","...hhhhhh...","...hsssws...","...ssssss...","..cbbbbbb...",".ccbbggbsss.",".ccbbbbbbss.",".cc.bbbbb...","..c.bbbbb...","....ddddd..."];
const L0=["....dd.dd...","....dd.dd...","....dd.dd...","...kkk.kkk.."],L1=["....ddd.d...","...dd...dd..","...dd...dd..","..kkk...kkk."];
const ALN=["....kkkk....","...kaaaak...","..kallllak..","..kaekkeak..","..kaaaaaak..","...kaaaak...","..kkkkkkkk..",".k.k.kk.k.k.",".k.k....k.k."];
const cache={};
function mk(rows,pal,key){if(cache[key])return cache[key];const c=document.createElement('canvas');c.width=rows[0].length;c.height=rows.length;const g=c.getContext('2d');rows.forEach((r,j)=>[...r].forEach((ch,i)=>{if(pal[ch]){g.fillStyle=pal[ch];g.fillRect(i,j,1,1)}}));return cache[key]=c}
const ronSpr=f=>mk(RON.concat(f?L1:L0),{h:'#2a1a0e',s:'#c89870',w:'#ddd',b:'#2a3a8a',g:PW[pw].l,c:PW[pw].c,d:'#161f55',k:'#080b1c'},'r'+pw+f);
const alnSpr=w=>mk(ALN,{a:EN[w].c,l:EN[w].l,k:'#07050e',e:'#ff3355'},'a'+w);
const wht=()=>mk(ALN,{a:'#fff',l:'#fff',k:'#fff',e:'#fff'},'wh');
let NAME='رون';try{NAME=localStorage.getItem('ronName')||'رون'}catch(e){}
let CFG={vol:.7,jump:1,dmg:1,fw:1,bk:1,bs:1};try{Object.assign(CFG,JSON.parse(localStorage.getItem('ronCfg')||'{}'))}catch(e){}
let AC;
function snd(f1,f2,d,type,vol){if(!AC||CFG.vol<=0)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(f2,30),t+d);g.gain.setValueAtTime((vol||.06)*CFG.vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(t+d)}
function noise(d,vol){if(!AC||CFG.vol<=0)return;const n=AC.sampleRate*d|0,b=AC.createBuffer(1,n,AC.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;g.gain.value=(vol||.12)*CFG.vol;s.connect(g);g.connect(AC.destination);s.start()}
let P,B,A,EB,PT,S,hp,lv,kills,boss,run=false,last=0,tShot,tSp,inv,T=0,tStep=0,O=[],tOb=2,SC=0,ws=30,keys={l:0,r:0,j:0,f:0};
const hud=document.getElementById('hud'),ov=document.getElementById('ov'),go=document.getElementById('go');
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{keys[k]=1;e.preventDefault()});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=0))});
const KM={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'j',' ':'f',z:'f',x:'j'};
addEventListener('keydown',e=>{if(KM[e.key])keys[KM[e.key]]=1});
addEventListener('keyup',e=>{if(KM[e.key])keys[KM[e.key]]=0});
function reset(){P={x:40,y:GY,vy:0};B=[];A=[];EB=[];PT=[];O=[];tOb=2;SC=0;S=0;hp=5;lv=1;kills=0;boss=false;tShot=0;tSp=1;inv=0;T=0}
function burst(px,py,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=30+Math.random()*90;PT.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.4+Math.random()*.4,c})}}
function hurt(d){hp-=d||1;inv=1.2;burst(P.x,P.y-7,'#ff3355',12);snd(160,40,.3,'sawtooth',.09);noise(.15,.08)}
function spawn(b){const w=Math.random()*Math.min(EN.length,lv+1)|0,h=b?40+lv*10:Math.ceil((2+lv)*(EN[w].hpm||1));A.push({x:W+20,y:b?GY-20:GY-14-Math.random()*16,w,hp:h,m:h,s:b?4:2,boss:b,ph:Math.random()*6,t:1.2,wt:0,vx:-(22+lv*4+Math.random()*14)*(EN[w].vm||1)});if(b)snd(90,40,.7,'sawtooth',.1)}
function shootAt(a,sp,dy,c){const dx=P.x-a.x,ddy=P.y-7-a.y,d=Math.hypot(dx,ddy)||1;EB.push({x:a.x-6*a.s,y:a.y,vx:dx/d*sp,vy:ddy/d*sp+dy,c})}
function eshoot(a){const t=EN[a.w];if(a.boss)[-40,0,40].forEach(d=>shootAt(a,t.sp,d,t.b));else if(t.tri)[-20,0,20].forEach(d=>shootAt(a,t.sp,d,t.b));else if(t.spread)[-25,25].forEach(d=>shootAt(a,t.sp,d,t.b));else shootAt(a,t.sp+lv*3,0,t.b);a.t=a.boss?.9:t.cd+Math.random()*.8;snd(320,120,.08,'sawtooth',.02)}
function bg(){const sk=['#03040d','#070a1c','#0b0f2a','#10143a','#171a4a','#1f1a52'];sk.forEach((c,i)=>{x.fillStyle=c;x.fillRect(0,i*26,W,26)});
x.fillStyle='#cfd6ff';for(let i=0;i<50;i++){if((T*2+i)%3<2)x.fillRect((i*83+11)%W,(i*37)%90,1,1)}
const sc=SC;
x.fillStyle='#0d1130';for(let px=0;px<W;px+=2){const h=(50+Math.sin((px+sc*.2)*.025)*18+Math.sin((px+sc*.2)*.07)*6)|0;x.fillRect(px,GY-h,2,h)}
x.fillStyle='#070a22';for(let px=0;px<W;px+=2){const h=(22+Math.sin((px+sc*.5)*.04+2)*10)|0;x.fillRect(px,GY-h,2,h)}
x.fillStyle='#10241a';x.fillRect(0,GY,W,H-GY);x.fillStyle='#2a5a30';x.fillRect(0,GY,W,3);x.fillStyle='#18391f';
for(let px=-((sc|0)%16);px<W;px+=16){x.fillRect(px,GY+5,8,2);x.fillRect(px+8,GY+14,8,2)}}
function floorAt(px,py0){let f=GY;for(const o of O){if(Math.abs(px-(o.x+o.w/2))<o.w/2+4){const top=GY-o.h;if(py0<=top+3&&top<f)f=top}}return f}
function hitO(px,py){for(const o of O){if(px>o.x&&px<o.x+o.w&&py>GY-o.h)return true}return false}
function drawO(o){const X=Math.round(o.x),Y=GY-o.h;x.fillStyle='#2b3048';x.fillRect(X,Y,o.w,o.h);x.fillStyle='#181b2c';for(let yy=Y+6;yy<GY;yy+=6)x.fillRect(X,yy,o.w,1);for(let xx=X+8;xx<X+o.w;xx+=8)x.fillRect(xx,Y+2,1,o.h-2);x.fillStyle='#454d70';x.fillRect(X,Y,o.w,2);x.fillRect(X,Y,1,o.h)}
function end(){run=false;startIdle();ov.style.display='flex';ov.querySelector('h1').textContent='💥 خلصت المعركة يا '+NAME;ov.querySelector('p').textContent='وصلت للمرحلة '+lv+' وجمعت '+S+' نقطة. الأرض تحتاجك مرة ثانية!';go.textContent='لعب مرة ثانية'}
go.onclick=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}catch(e){}reset();ov.style.display='none';pickPower('المرحلة 1',()=>{run=true;banner(1,0);last=performance.now();requestAnimationFrame(loop)})};
const msg=document.getElementById('msg');let msgT;
function banner(l,nw){msg.textContent='المرحلة '+l+(nw&&l<EN.length?' — عدو جديد: '+NM[l]:'');msg.style.display='block';clearTimeout(msgT);msgT=setTimeout(()=>msg.style.display='none',3200)}
let idleOn=false,paused=false;
function idle(n){if(run||paused){idleOn=false;return}const dt=Math.min((n-(idle.l||n))/1000,.05);idle.l=n;T+=dt;SC+=30*dt;bg();x.drawImage(ronSpr(Math.floor(T*10)%2),Math.round(W*.25-6),GY-14);requestAnimationFrame(idle)}
function startIdle(){if(!idleOn){idleOn=true;idle.l=0;requestAnimationFrame(idle)}}
const gear=document.getElementById('gear'),set=document.getElementById('set');
const SL=[['vol','الصوت',0,100,100],['jump','ارتفاع القفز',60,140,100],['dmg','قوة الضرب',1,3,1],['fw','سرعة التقدم',50,200,100],['bk','سرعة الرجوع',50,200,100],['bs','حجم الأزرار',60,160,100]];
set.innerHTML='<h2>⚙️ الإعدادات</h2>';
SL.forEach(([k,t,mn,mx,sc])=>{const l=document.createElement('label'),s=document.createElement('span'),i=document.createElement('input'),v=document.createElement('b');s.textContent=t;i.type='range';i.min=mn;i.max=mx;i.step=1;i.value=Math.round(CFG[k]*sc);const sh=()=>v.textContent=sc==1?i.value+'x':i.value+'%';sh();i.oninput=()=>{CFG[k]=i.value/sc;sh();try{localStorage.setItem('ronCfg',JSON.stringify(CFG))}catch(e){}if(k==='vol')snd(600,300,.1,'square',.06);if(k==='bs')applyBS()};l.append(s,i,v);set.appendChild(l)});
function applyBS(){document.documentElement.style.setProperty('--bs',CFG.bs||1)}applyBS();
const okb=document.createElement('button');okb.textContent='تم';set.appendChild(okb);
function openSet(o){keys.l=keys.r=keys.j=keys.f=0;set.style.display=o?'flex':'none';if(o&&run){run=false;paused=true}else if(!o&&paused){paused=false;run=true;last=performance.now();requestAnimationFrame(loop)}}
gear.onclick=()=>{if(!picking)openSet(set.style.display!=='flex')};okb.onclick=()=>openSet(false);
reset();startIdle();
const nmEl=document.getElementById('nm');nmEl.value=NAME;nmEl.oninput=()=>{NAME=nmEl.value.trim().slice(0,12)||'رون';try{localStorage.setItem('ronName',NAME)}catch(e){}ov.querySelector('h1').textContent='👋 أهلاً بيك يا '+NAME+'!'};
ov.querySelector('h1').textContent='👋 أهلاً بيك يا '+NAME+'!';
ov.querySelector('p').textContent='العالم يحتاجك هسه! الفضائيين غزوا الأرض ولا أحد غيرك يكدر يوقفهم. بيك طاقة الطبيعة الخضراء، وكل مرحلة تتقدم بيها يظهر عدو جديد وأقوى. اضغط الزر الأخضر للرمي، وإنط حتى تتفادى الطلقات. ومن ⚙️ تكدر تغيّر الإعدادات.';
const pwEl=document.getElementById('pw');let picking=false;setFire();
function setFire(){const f=document.getElementById('fire');f.style.background=PW[pw].c;f.textContent=PW[pw].e}
function pickPower(title,cb){keys.l=keys.r=keys.j=keys.f=0;picking=true;pwEl.innerHTML='<h2>'+title+'</h2><p>اختر القوة اللي تستخدمها بهذي المرحلة</p>';const row=document.createElement('div');PW.forEach((p,i)=>{const b=document.createElement('button');b.innerHTML=p.e+'<small>'+p.n+'</small>';b.style.background=p.c+'cc';b.style.outline=i===pw?'3px solid #fff':'none';b.onclick=()=>{pw=i;setFire();picking=false;pwEl.style.display='none';cb()};row.appendChild(b)});pwEl.appendChild(row);const info=document.createElement('p');info.textContent='🔥 ضرر عالي · ❄️ يبطّئ الأعداء · 🌿 متوازنة · 🌪️ رمي سريع · ⚡ تخترق كل الأعداء';pwEl.appendChild(info);pwEl.style.display='flex'}
function loop(n){if(!run)return;const dt=Math.min((n-last)/1000,.05);last=n;T+=dt;
const mv=keys.r-keys.l;ws=30+(keys.r?40:0)-(keys.l?20:0);SC+=ws*dt;tOb-=dt;if(tOb<=0){O.push({x:W+10,w:16+(Math.random()*5|0)*5,h:Math.random()<.5?12:22});tOb=2.5+Math.random()*2.5}O.forEach(o=>o.x-=ws*dt);O=O.filter(o=>o.x+o.w>-10);P.x=Math.max(10,Math.min(W*.65,P.x+mv*80*(mv>0?CFG.fw:CFG.bk)*dt));O.forEach(o=>{const top=GY-o.h;if(P.y>top+3&&P.x>o.x-5&&P.x<o.x+o.w+5){if(P.x<o.x+o.w/2)P.x=o.x-5;else P.x=o.x+o.w+5;if(P.x<6){hurt();P.x=o.x+o.w+8}}});
const air=P.y<floorAt(P.x,P.y)-.5;
if(keys.j&&!air){P.vy=-190*CFG.jump;snd(220,640,.16,'square',.05)}
{const py0=P.y,vy0=P.vy;P.vy+=560*dt;P.y+=P.vy*dt;const f=floorAt(P.x,py0);if(P.y>=f&&P.vy>=0){P.y=f;P.vy=0;if(vy0>80)snd(130,60,.07,'triangle',.07)}}
if(mv&&!air){tStep-=dt;if(tStep<=0){tStep=.26;snd(100,55,.05,'triangle',.06)}}
inv-=dt;tShot-=dt;if(keys.f&&tShot<=0){tShot=PW[pw].cd;B.push({x:P.x+12,y:P.y-9,p:pw});snd(820,220,.1,'square',.04)}
tSp-=dt;if(tSp<=0&&!boss){tSp=5;if(kills>=lv*4){boss=true;spawn(true)}else spawn(false)}
B.forEach(b=>b.x+=240*dt);B=B.filter(b=>{if(hitO(b.x+3,b.y)){burst(b.x+3,b.y,'#7dff8a',3);snd(150,100,.04,'triangle',.04);return false}return b.x<W+10});
A.forEach(a=>{a.ph+=dt;a.wt-=dt;a.sl-=dt;
if(a.boss){if(a.x>W-60)a.x-=30*dt}else{a.x+=(a.x>P.x&&a.x-P.x<60?-a.vx*.8:a.vx)*dt*(a.sl>0?.4:1);a.y+=Math.cos(a.ph*2)*(EN[a.w].wv||6)*dt;a.y=Math.max(14,Math.min(GY-12,a.y))}
a.t-=dt;if(a.t<=0&&a.x<W-4)eshoot(a)});
EB.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt});
EB=EB.filter(b=>{if(hitO(b.x,b.y)){burst(b.x,b.y,b.c,3);return false}if(inv<=0&&Math.abs(b.x-P.x)<6&&Math.abs(b.y-(P.y-7))<8){hurt(.5);return false}return b.x>-8&&b.x<W+8&&b.y>-8&&b.y<H+8});
B=B.filter(b=>{for(const a of A){if(Math.abs(b.x-a.x)<6*a.s&&Math.abs(b.y-a.y)<4.5*a.s){if(b.h&&b.h.includes(a))continue;const P2=PW[b.p];a.hp-=CFG.dmg*P2.dm;a.wt=.08;S++;if(P2.slow)a.sl=1.2;burst(b.x,b.y,P2.c,4);snd(260,140,.05,'sawtooth',.03);if(P2.pierce){(b.h=b.h||[]).push(a);continue}return false}}return true});

if(inv<=0&&Math.abs(a.x-P.x)<6*a.s+5&&Math.abs(a.y-(P.y-7))<4.5*a.s+7){hurt();if(!a.boss)return false}
if(a.x<-20&&!a.boss){hp--;return false}return true});
bg();O.forEach(drawO);
A.forEach(a=>{x.drawImage(a.wt>0?wht():alnSpr(a.w),Math.round(a.x-6*a.s),Math.round(a.y-4.5*a.s),12*a.s,9*a.s);
if(a.boss){x.fillStyle='#000';x.fillRect(W/2-50,6,100,6);x.fillStyle='#c0243e';x.fillRect(W/2-49,7,98*a.hp/a.m,4)}});
if(!(inv>0&&Math.floor(T*12)%2)){x.drawImage(ronSpr(P.vy?1:mv?Math.floor(T*10)%2:0),Math.round(P.x-6),Math.round(P.y-14));if(keys.f){x.fillStyle=PW[pw].l;x.fillRect(Math.round(P.x+11),Math.round(P.y-10),3,3)}}
B.forEach(b=>{x.fillStyle=PW[b.p].c;x.fillRect(Math.round(b.x-3),Math.round(b.y-1),7,3);x.fillStyle=PW[b.p].l;x.fillRect(Math.round(b.x-1),Math.round(b.y),4,1)});

PT=PT.filter(p=>{p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;if(p.l<=0)return false;x.fillStyle=p.c;x.fillRect(Math.round(p.x),Math.round(p.y),2,2);return true});
